  <style>
    :root {
      --bg: #f3f5fb;
      --surface: #ffffff;
      --surface2: #f8faff;
      --text: #141b34;
      --muted: #68718c;
      --line: #dfe5f3;
      --primary: #2836D4;
      --primary-soft: rgba(40,54,212,0.10);
      --ok: #0ea271;
      --warn: #d97706;
      --danger: #dc2626;
      --radius: 10px;
      --ts: 0.78rem; /* table cell font-size */
      --th: 0.68rem; /* table header font-size */
      --tp: 7px 8px;  /* table cell padding */
    }
    /* Font scale tokens */
    body.fs-2xs { --ts:0.62rem; --th:0.56rem; --tp:4px 6px; }
    body.fs-xs  { --ts:0.68rem; --th:0.60rem; --tp:5px 7px; }
    body.fs-sm  { --ts:0.74rem; --th:0.64rem; --tp:6px 8px; }
    body.fs-md  { --ts:0.82rem; --th:0.70rem; --tp:8px 10px; }
    body.fs-lg  { --ts:0.92rem; --th:0.78rem; --tp:10px 12px; }
    body.fs-xl  { --ts:1.02rem; --th:0.86rem; --tp:12px 14px; }

    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    button,input,select{font:inherit;}
    button{cursor:pointer;border:none;background:none;}

    /* ── TOPBAR ── */
    #topbar {
      position:sticky;top:0;z-index:50;
      background:rgba(243,245,251,0.92);
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      padding:6px 12px;
      display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    }
    .brand {
      display:flex;align-items:center;gap:7px;
      font-weight:800;font-size:0.9rem;color:var(--primary);
      white-space:nowrap;margin-right:4px;
    }
    .brand-icon {
      width:28px;height:28px;border-radius:8px;
      background:linear-gradient(135deg,var(--primary),#5060f0);
      display:grid;place-items:center;
      font-size:0.7rem;font-weight:900;color:#fff;
    }
    /* Search */
    #searchWrap {
      display:flex;align-items:center;gap:6px;
      background:var(--surface);border:1.5px solid var(--line);
      border-radius:8px;padding:4px 10px;flex:1;min-width:140px;max-width:320px;
    }
    #searchWrap input {
      border:none;outline:none;background:transparent;
      font-size:0.82rem;color:var(--text);width:100%;
    }
    #searchWrap input::placeholder{color:var(--muted);}
    .search-icon{color:var(--muted);font-size:0.9rem;}

    /* Toolbar buttons */
    .tb-btn {
      display:inline-flex;align-items:center;gap:5px;
      padding:5px 10px;border-radius:7px;font-size:0.76rem;font-weight:600;
      border:1.5px solid var(--line);background:var(--surface);color:var(--text);
      white-space:nowrap;transition:background 0.15s,border-color 0.15s;
    }
    .tb-btn:hover{background:var(--surface2);border-color:#c0c8e4;}
    .tb-btn.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
    .tb-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
    .tb-btn.primary:hover{background:#1e2bb8;}

    /* Column filter button */
    .col-filter-btn {
      padding:1px 3px;border-radius:3px;font-size:0.6rem;
      color:#6070b0;background:transparent;transition:all 0.1s;
      flex-shrink:0;line-height:1;
    }
    .col-filter-btn:hover,.col-filter-btn.active{
      background:var(--primary);color:#fff;
    }
    /* Column filter panel (floating) */
    #colFilterPanel {
      position:fixed;z-index:300;
      background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
      box-shadow:0 8px 32px rgba(30,46,110,0.18);
      min-width:200px;max-width:280px;
      display:none;
    }
    #colFilterPanel.open{display:block;}
    .cfp-head{
      padding:7px 10px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;
      font-size:0.7rem;font-weight:700;text-transform:uppercase;
      letter-spacing:0.04em;color:var(--muted);
      position:sticky;top:0;background:var(--surface);border-radius:10px 10px 0 0;
    }
    .cfp-search{
      padding:5px 8px;border-bottom:1px solid var(--line);
    }
    .cfp-search input{
      width:100%;border:1.5px solid var(--line);border-radius:6px;
      padding:3px 7px;font-size:0.75rem;background:var(--bg);
      outline:none;transition:border-color 0.15s;
    }
    .cfp-search input:focus{border-color:var(--primary);}
    .cfp-list{max-height:220px;overflow-y:auto;}
    .cfp-option{
      display:flex;align-items:center;gap:7px;
      padding:4px 10px;font-size:0.76rem;cursor:pointer;
      transition:background 0.1s;
    }
    .cfp-option:hover{background:var(--bg);}
    .cfp-option input[type=checkbox]{
      accent-color:var(--primary);width:13px;height:13px;flex-shrink:0;cursor:pointer;
    }
    .cfp-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    /* Month range inside cfp */
    .cfp-month{padding:8px 10px;display:flex;flex-direction:column;gap:6px;}
    .cfp-month label{font-size:0.64rem;font-weight:700;color:var(--muted);text-transform:uppercase;}
    .cfp-month input[type=month]{
      width:100%;border:1.5px solid var(--line);border-radius:6px;
      padding:4px 7px;font-size:0.75rem;background:var(--bg);
      outline:none;transition:border-color 0.15s;
    }
    .cfp-month input[type=month]:focus{border-color:var(--primary);}
    .cfp-foot{
      padding:6px 10px;border-top:1px solid var(--line);
      display:flex;gap:6px;justify-content:flex-end;
    }
    .cfp-empty{padding:12px;text-align:center;font-size:0.75rem;color:var(--muted);}

    .tb-sep{width:1px;height:20px;background:var(--line);margin:0 2px;flex-shrink:0;}

    /* ── FILTER BAR ── */
    #filterBar {
      background:var(--surface);
      border-bottom:1px solid var(--line);
      padding:6px 12px;
      display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;
    }
    #filterBar.collapsed{display:none;}

    .filter-group {
      display:flex;flex-direction:column;gap:3px;min-width:130px;max-width:200px;
    }
    .filter-group label {
      font-size:0.62rem;font-weight:700;text-transform:uppercase;
      letter-spacing:0.05em;color:var(--muted);
    }
    /* Multi-select dropdown */
    .ms-wrap {position:relative;}
    .ms-trigger {
      display:flex;align-items:center;justify-content:space-between;
      background:var(--bg);border:1.5px solid var(--line);border-radius:6px;
      padding:4px 8px;font-size:0.75rem;cursor:pointer;gap:4px;
      min-height:28px;color:var(--text);transition:border-color 0.15s;
    }
    .ms-trigger:hover,.ms-trigger.open{border-color:var(--primary);}
    .ms-trigger.has-value{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
    .ms-trigger .ms-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ms-trigger .ms-arrow{font-size:0.6rem;flex-shrink:0;transition:transform 0.15s;}
    .ms-trigger.open .ms-arrow{transform:rotate(180deg);}
    .ms-dropdown {
      position:absolute;top:calc(100% + 4px);left:0;z-index:200;
      background:var(--surface);border:1.5px solid var(--line);border-radius:8px;
      box-shadow:0 8px 32px rgba(30,46,110,0.14);
      min-width:180px;max-width:260px;max-height:240px;
      overflow-y:auto;display:none;
    }
    .ms-dropdown.open{display:block;}
    .ms-search {
      padding:6px 8px;border-bottom:1px solid var(--line);
      display:flex;align-items:center;gap:6px;
      position:sticky;top:0;background:var(--surface);z-index:1;
    }
    .ms-search input{
      border:none;outline:none;font-size:0.76rem;background:transparent;
      color:var(--text);width:100%;
    }
    .ms-search input::placeholder{color:var(--muted);}
    .ms-option {
      display:flex;align-items:center;gap:7px;
      padding:5px 10px;font-size:0.76rem;cursor:pointer;
      transition:background 0.1s;
    }
    .ms-option:hover{background:var(--bg);}
    .ms-option input[type=checkbox]{
      width:13px;height:13px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;
    }
    .ms-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ms-empty{padding:10px;font-size:0.76rem;color:var(--muted);text-align:center;}

    /* Date range */
    .date-range {display:flex;align-items:center;gap:4px;}
    .date-range input[type=date] {
      background:var(--bg);border:1.5px solid var(--line);border-radius:6px;
      padding:4px 6px;font-size:0.73rem;color:var(--text);
      min-height:28px;width:126px;transition:border-color 0.15s;
    }
    .date-range input[type=date]:focus{outline:none;border-color:var(--primary);}
    .date-range.has-value input[type=date]{border-color:var(--primary);background:var(--primary-soft);}
    .date-range span{font-size:0.68rem;color:var(--muted);}

    /* Text filter input */
    .filter-input {
      background:var(--bg);border:1.5px solid var(--line);border-radius:6px;
      padding:4px 8px;font-size:0.75rem;color:var(--text);
      min-height:28px;width:100%;transition:border-color 0.15s;
    }
    .filter-input:focus{outline:none;border-color:var(--primary);}
    .filter-input.has-value{border-color:var(--primary);background:var(--primary-soft);}

    /* ── CHIPS BAR ── */
    #chipsBar {
      padding:4px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
      background:var(--bg);border-bottom:1px solid transparent;min-height:0;
    }
    #chipsBar:empty{display:none;}
    .chip {
      display:inline-flex;align-items:center;gap:4px;
      background:var(--primary-soft);border:1px solid rgba(40,54,212,0.2);
      color:var(--primary);border-radius:20px;
      padding:2px 8px 2px 9px;font-size:0.70rem;font-weight:600;
    }
    .chip button{
      display:grid;place-items:center;width:14px;height:14px;
      border-radius:50%;background:rgba(40,54,212,0.15);
      font-size:0.65rem;color:var(--primary);transition:background 0.1s;
    }
    .chip button:hover{background:rgba(40,54,212,0.3);}

    /* ── MAIN / TABLE AREA ── */
    #mainArea {
      display:flex;flex-direction:column;height:calc(100vh - var(--topbar-h, 42px));
      overflow:hidden;
    }
    #kpisRow {
      display:flex;gap:10px;padding:8px 12px;
      background:var(--bg);border-bottom:1px solid var(--line);
      flex-wrap:nowrap;overflow-x:auto;
    }
    #kpisRow.hidden{display:none;}
    .kpi {
      background:var(--surface);border:1px solid var(--line);border-radius:8px;
      padding:8px 12px;min-width:130px;flex:1;
    }
    .kpi-label{font-size:0.63rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);}
    .kpi-value{font-size:1.2rem;font-weight:800;color:var(--text);line-height:1.2;margin:2px 0;}
    .kpi-sub{font-size:0.63rem;color:var(--muted);}
    .kpi-bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px;}
    .kpi-bar-fill{height:100%;border-radius:2px;background:var(--primary);transition:width 0.4s;}

    /* Table shell */
    #tableWrap {
      flex:1;overflow:auto;
      /* must NOT have position:relative for sticky thead to work */
    }
    table {
      width:100%;border-collapse:separate;border-spacing:0;font-size:var(--ts);
      table-layout:fixed;
    }
    thead {
      position:relative;
      z-index:20;
    }
    th {
      font-size:var(--th);font-weight:700;text-transform:uppercase;
      letter-spacing:0.04em;color:#3a4070;
      background:linear-gradient(180deg,#e8ecf8 0%,#dde3f4 100%);
      border-bottom:2px solid #b8c2e0;border-right:1px solid #c8d0e8;
      /* With border-collapse:separate we need top border too */
      border-top:1px solid #c8d0e8;
      padding:var(--tp);white-space:nowrap;
      text-align:center;
      position:sticky;
      top:0;
      z-index:25;
      overflow:hidden;
    }
    th:first-child{border-left:1px solid #c8d0e8;}
    th:last-child{border-right:1px solid #c8d0e8;}
    th .th-inner{display:flex;align-items:center;justify-content:center;gap:3px;}
    th button.sort-btn{
      background:none;border:none;cursor:pointer;
      font:inherit;font-size:var(--th);font-weight:700;
      text-transform:uppercase;letter-spacing:0.04em;
      color:#3a4070;display:flex;align-items:center;gap:3px;
    }
    th button.sort-btn:hover{color:var(--primary);}
    th.sort-active{background:linear-gradient(180deg,#d4d9f5 0%,#c4ccf0 100%);}
    th.sort-active button.sort-btn{color:var(--primary);}
    /* Resize handle */
    .col-resizer {
      position:absolute;right:0;top:0;bottom:0;
      width:5px;cursor:col-resize;
      background:transparent;z-index:5;
      transition:background 0.15s;
    }
    .col-resizer:hover,.col-resizer.resizing{background:var(--primary);}
    td {
      padding:var(--tp);border-bottom:1px solid var(--line);
      border-right:1px solid var(--line);vertical-align:middle;
      text-align:center;
    }
    td:first-child{border-left:1px solid var(--line);}
    td:last-child{border-right:1px solid var(--line);}
    tr:hover td{background:rgba(40,54,212,0.03);}
    .col-num{text-align:center;font-variant-numeric:tabular-nums;font-weight:600;}
    .col-date{white-space:nowrap;color:var(--muted);text-align:center;}
    .col-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;display:block;}
    .col-ref{font-weight:600;color:var(--primary);text-align:center;}
    /* Row selection */
    tr.selected td { background:rgba(40,54,212,0.10) !important; }
    tr { cursor:pointer; }

    /* ── TOAST / COPY FEEDBACK ── */
    #toast {
      position:fixed;bottom:0;left:0;right:0;
      background:#1e2744;color:#fff;
      font-size:0.75rem;font-weight:500;
      padding:7px 16px;
      display:flex;align-items:center;gap:8px;
      transform:translateY(100%);transition:transform 0.2s;
      z-index:500;
    }
    #toast.show{transform:translateY(0);}
    #toast .toast-icon{font-size:0.9rem;color:#7be0a8;}
    #toast .toast-val{
      font-weight:700;color:#a5b4fc;
      max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }

    /* Badges */
    .badge {
      display:inline-flex;align-items:center;
      padding:1px 6px;border-radius:20px;font-size:0.65rem;font-weight:700;
      background:var(--surface2);border:1px solid var(--line);color:var(--text);
      white-space:nowrap;
    }
    .badge.empty{color:var(--muted);border-color:transparent;background:transparent;}
    /* Status color system */
    .badge.s-ok{background:rgba(14,162,113,0.12);border-color:rgba(14,162,113,0.3);color:#0a7a55;}
    .badge.s-warn{background:rgba(217,119,6,0.12);border-color:rgba(217,119,6,0.3);color:#92400e;}
    .badge.s-danger{background:rgba(220,38,38,0.12);border-color:rgba(220,38,38,0.3);color:#991b1b;}
    .badge.s-blue{background:rgba(40,54,212,0.10);border-color:rgba(40,54,212,0.2);color:var(--primary);}
    .badge.s-gray{background:var(--surface2);border-color:var(--line);color:var(--muted);}

    /* Img action btn */
    .img-btn {
      padding:2px 7px;border-radius:5px;font-size:0.65rem;font-weight:700;
      background:var(--primary-soft);color:var(--primary);border:1px solid rgba(40,54,212,0.2);
      transition:background 0.1s;
    }
    .img-btn:hover{background:rgba(40,54,212,0.18);}
    .img-btn:disabled{opacity:0.35;cursor:default;}

    /* ── PAGINATION ── */
    #paginationBar {
      display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
      padding:6px 12px;
      background:var(--surface);border-top:1px solid var(--line);
      font-size:0.75rem;color:var(--muted);
    }
    .pg-group{display:flex;align-items:center;gap:6px;}
    .pg-btn {
      padding:3px 10px;border-radius:6px;font-size:0.74rem;font-weight:600;
      border:1.5px solid var(--line);background:var(--surface);color:var(--text);
      transition:background 0.1s;
    }
    .pg-btn:hover:not(:disabled){background:var(--bg);}
    .pg-btn:disabled{opacity:0.4;cursor:default;}
    .pg-select {
      padding:3px 6px;border-radius:6px;font-size:0.74rem;
      border:1.5px solid var(--line);background:var(--surface);color:var(--text);
    }

    /* ── COLUMN PANEL ── */
    #columnsPanel {
      position:absolute;top:calc(var(--topbar-h, 42px) + 4px);right:12px;z-index:100;
      background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
      box-shadow:0 8px 32px rgba(30,46,110,0.14);
      min-width:220px;max-width:300px;max-height:400px;
      overflow-y:auto;display:none;
    }
    #columnsPanel.open{display:block;}
    .col-panel-header{
      padding:8px 12px;font-size:0.7rem;font-weight:700;
      text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);
      border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);
    }
    .col-toggle {
      display:flex;align-items:center;justify-content:space-between;
      padding:5px 12px;cursor:pointer;font-size:0.78rem;gap:8px;transition:background 0.1s;
    }
    .col-toggle:hover{background:var(--bg);}
    .col-toggle input[type=checkbox]{accent-color:var(--primary);width:13px;height:13px;}

    /* ── STATES ── */
    .loading-state,.empty-state {
      padding:48px 24px;text-align:center;color:var(--muted);font-size:0.88rem;
    }
    .loading-state strong,.empty-state strong{display:block;color:var(--text);margin-bottom:6px;font-size:1rem;}

    /* ── IMAGE MODAL ── */
    #modalBackdrop {
      position:fixed;inset:0;z-index:80;background:rgba(0,0,0,0.5);
      display:none;
    }
    #modalBackdrop.open{display:block;}
    #imageModal {
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:90;background:var(--surface);border-radius:14px;
      box-shadow:0 20px 60px rgba(0,0,0,0.2);
      width:min(820px,calc(100vw - 24px));max-height:90vh;
      overflow:auto;display:none;flex-direction:column;
    }
    #imageModal.open{display:flex;}
    .modal-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 16px;border-bottom:1px solid var(--line);
      font-weight:700;font-size:0.92rem;
    }
    .modal-body-grid{
      display:grid;grid-template-columns:minmax(240px,320px) 1fr;
      gap:16px;padding:16px;align-items:start;
    }
    @media(max-width:600px){.modal-body-grid{grid-template-columns:1fr;}}
    .modal-img{
      border-radius:10px;overflow:hidden;background:var(--bg);
      display:flex;align-items:center;justify-content:center;min-height:200px;
    }
    .modal-img img{width:100%;height:auto;display:block;}
    .modal-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .meta-card{background:var(--bg);border-radius:8px;padding:8px 10px;}
    .meta-card .label{font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);}
    .meta-card .value{font-size:0.84rem;font-weight:700;margin-top:2px;}

    /* ── MISC ── */
    @keyframes spin{to{transform:rotate(360deg);}}
    .spin{animation:spin 0.7s linear infinite;}
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:#c8cfe4;border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:#a8b2cc;}
  </style>
</head>
<body class="fs-sm">

<!-- TOPBAR -->
<div id="topbar">
  <div class="brand">

    Programação
  </div>

  <div id="searchWrap">

  </div>

  <button class="tb-btn" id="btnToggleCols" title="Colunas">▥ Colunas</button>
  <button class="tb-btn" id="btnToggleKpis" title="KPIs">◫ KPIs</button>

  <!-- Year filter -->
  <select id="yearSel" class="pg-select" title="Filtrar por ano" style="font-size:0.75rem;padding:4px 8px;">

  </select>

  <button class="tb-btn" id="btnClearAll" title="Limpar tudo">✕ Limpar</button>
  <button class="tb-btn" id="btnRefresh"><span id="refreshIcon">↻</span></button>

  <div class="tb-sep"></div>

  <!-- Font size picker -->
  <select id="fsSel" class="pg-select" title="Tamanho da fonte da tabela" style="font-size:0.75rem;padding:4px 6px;">

</div>

<!-- COLUMNS PANEL (floating) -->

<!-- KPIs -->
<div id="kpisRow"></div>

<!-- TABLE -->
<div id="tableWrap">

</div>

<!-- PAGINATION -->

    <button class="tb-btn" id="cfpClear" style="font-size:0.72rem;">Limpar</button>

  </div>
</div>

<!-- TOAST -->
<div id="toast"><span class="toast-icon">✓</span><span>Copiado:</span><span class="toast-val" id="toastVal"></span></div>

<!-- IMAGE MODAL -->
<div id="modalBackdrop"></div>
<div id="imageModal" role="dialog" aria-modal="true">
  <div class="modal-head">
    <span id="modalTitle">Produto</span>
    <button class="tb-btn" id="btnCloseModal">Fechar ×</button>
  </div>
  <div class="modal-body-grid">
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-meta-grid" id="modalMeta"></div>
  </div>
</div>

<script>
const XLSX_PATH = './DETALHADA.xlsx';
const IMG_FOLDER = './imagens_olympikus/';
const IMG_EXT = '.jpg';
const PAGE_OPTS = [25,50,100,250,500];
const LS_COL = 'oly-cols-v2';
const LS_UI  = 'oly-ui-v2';

// ── Column definitions ──────────────────────────────────────────
const COLS = [
  { key:'IMAGEM',        label:'Img',        type:'image',  def:false },
  { key:'NOME FANTASIA', label:'Cliente',     type:'text',   def:true  },
  { key:'CODIGO',        label:'Cód.',        type:'number', def:false },
  { key:'PORTA',         label:'Porta',       type:'text',   def:true  },
  { key:'MARCA',         label:'Marca',       type:'text',   def:true  },
  { key:'FABRICA',       label:'Fábrica',     type:'text',   def:true  },
  { key:'FILIAL',        label:'Filial',      type:'text',   def:true  },
  { key:'NF',            label:'NF',          type:'text',   def:false },
  { key:'OC',            label:'OC',          type:'text',   def:false },
  { key:'GCI',           label:'GCI',         type:'text',   def:true  },
  { key:'REFERENCIA',    label:'Referência',  type:'text',   def:true  },
  { key:'DESCRICAO',     label:'Descrição',   type:'text',   def:true  },
  { key:'COR',           label:'Cor',         type:'text',   def:true  },
  { key:'PREV FAT',      label:'Prev.Fat',    type:'date',   def:true  },
  { key:'CART',          label:'Carteira',    type:'number', def:true  },
  { key:'FAT',           label:'Faturado',    type:'number', def:true  },
  { key:'DATA FAT',      label:'Data Fat',    type:'date',   def:false },
  { key:'CONCAT',        label:'Concat',      type:'text',   def:false },
  { key:'STATUS 1',      label:'Status 1',    type:'status', def:true  },
  { key:'STATUS 2',      label:'Status 2',    type:'status', def:true  },
  { key:'STATUS 3',      label:'Status 3',    type:'status', def:false },
];

// Filter fields config: select=multi-select, date=range, text=text input
const FILTERS = []; // Column-level filters used instead

// ── State ───────────────────────────────────────────────────────
const S = {
  raw:[], filtered:[],
  visibleCols: new Set(),
  colWidths: {},
  colFilters: {}, // key -> [] selected values (for ms cols) or {from,to} for date/month
  selectedRowId: null,
  // filters: { key: [] for ms, {from,to} for date, string for text }
  filters: {},
  sort: { key:'PREV FAT', dir:'asc' },
  page: 1, pageSize: 100,
  ui: { kpisHidden:false, filtersOpen:true, fontSize:'fs-sm' }
};

// ── Utility ─────────────────────────────────────────────────────
function esc(t){ return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function asDate(v){
  if(!v) return null;
  if(v instanceof Date && !isNaN(v)) return v;
  const d=new Date(v); return isNaN(d)?null:d;
}
function fmtDate(v){ const d=asDate(v); return d?d.toLocaleDateString('pt-BR'):'—'; }
function fmtNum(v){ const n=Number(v||0); return n.toLocaleString('pt-BR'); }
function colDef(k){ return COLS.find(c=>c.key===k); }

// Status badge color
const STATUS_OK      = new Set(['OK','FATURADO','SUCESSO','FATURAR']);
const STATUS_DANGER  = new Set(['URGENTE','ATRASADO','CANCELAR']);
const STATUS_WARN    = new Set(['AGUARDAR','PENDENTE','CONFIRMAR','PEND 04/02']);
const STATUS_BLUE    = new Set(['PLANILHAR','PLANILHADO','INSERIR OC','ATUALIZAR OC','FAZER']);
function statusClass(v){
  const u = String(v||'').toUpperCase();
  if(STATUS_OK.has(u))     return 's-ok';
  if(STATUS_DANGER.has(u)) return 's-danger';
  if(STATUS_WARN.has(u))   return 's-warn';
  if(STATUS_BLUE.has(u))   return 's-blue';
  return 's-gray';
}

// ── LocalStorage ────────────────────────────────────────────────
function savePrefs(){
  localStorage.setItem(LS_COL, JSON.stringify([...S.visibleCols]));
  localStorage.setItem(LS_UI, JSON.stringify(S.ui));
}
function loadPrefs(){
  try{ const c=JSON.parse(localStorage.getItem(LS_COL)||'null'); if(c) S.visibleCols=new Set(c); }catch(e){}
  try{ const u=JSON.parse(localStorage.getItem(LS_UI)||'null'); if(u) S.ui={...S.ui,...u}; }catch(e){}
}
function initCols(){
  const saved=localStorage.getItem(LS_COL);
  if(saved){ try{ S.visibleCols=new Set(JSON.parse(saved)); return; }catch(e){} }
  S.visibleCols=new Set(COLS.filter(c=>c.def).map(c=>c.key));
}

// ── Parse XLSX ──────────────────────────────────────────────────
function parseXlsx(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const json=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false,cellDates:true});
  return json.map((row,i)=>({
    ...row,
    __id: i+1,
    __img: row['IMAGEM'] ? `${IMG_FOLDER}${encodeURIComponent(String(row['IMAGEM']).trim())}${IMG_EXT}` : '',
    __year: String(( asDate(row['PREV FAT']) || asDate(row['DATA FAT']) )?.getFullYear() || ''),
    __srch: [row['NOME FANTASIA'],row['PORTA'],row['MARCA'],row['REFERENCIA'],row['DESCRICAO'],row['COR'],row['GCI']].filter(Boolean).join(' ').toLowerCase()
  }));
}

// ── Build filter bar ─────────────────────────────────────────────
// cache of options per key
const optsCache = {};

function buildFilterBar(){
  const bar = document.getElementById('filterBar');
  if(!bar || !FILTERS.length) return; // nothing to build
  FILTERS.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'filter-group';
    const lbl = document.createElement('label');
    lbl.textContent = f.label;
    wrap.appendChild(lbl);

    if(f.type === 'ms'){
      let opts = f.options ? f.options : (() => {
        if(f.key==='__YEAR__') return [...new Set(S.raw.map(r=>r.__year).filter(Boolean))].sort((a,b)=>b.localeCompare(a));
        return [...new Set(S.raw.map(r=>String(r[f.key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
      })();
      optsCache[f.key] = opts;
      wrap.appendChild(buildMultiSelect(f.key, opts));
    } else if(f.type === 'date'){
      wrap.appendChild(buildDateRange(f.key));
    } else if(f.type === 'month'){
      wrap.appendChild(buildMonthRange(f.key));
    } else {
      const inp = document.createElement('input');
      inp.type='text'; inp.className='filter-input';
      inp.placeholder=`Filtrar ${f.label.toLowerCase()}...`;
      inp.dataset.filterKey=f.key;
      const cur=S.filters[f.key];
      if(typeof cur==='string'&&cur){ inp.value=cur; inp.classList.add('has-value'); }
      inp.addEventListener('input', debounce(()=>{
        const v=inp.value.trim();
        if(v){ S.filters[f.key]=v; inp.classList.add('has-value'); }
        else { delete S.filters[f.key]; inp.classList.remove('has-value'); }
        applyAndRender();
      }, 200));
      wrap.appendChild(inp);

    bar.appendChild(wrap);
  });
  syncFilterUI();
}

function buildMultiSelect(key, opts){
  const wrap = document.createElement('div');
  wrap.className = 'ms-wrap';
  wrap.dataset.msKey = key;

  const trigger = document.createElement('div');
  trigger.className = 'ms-trigger';
  trigger.innerHTML = `<span class="ms-label">Todos</span><span class="ms-arrow">▾</span>`;

  const dropdown = document.createElement('div');
  dropdown.className = 'ms-dropdown';

  // Search inside dropdown
  const searchRow = document.createElement('div');
  searchRow.className = 'ms-search';
  const si = document.createElement('input');
  si.type='text'; si.placeholder='Buscar...';
  searchRow.appendChild(si);
  dropdown.appendChild(searchRow);

  const listWrap = document.createElement('div');
  listWrap.dataset.list = key;

  function renderOpts(q=''){
    const sel = (S.filters[key]||[]);
    const filtered = q ? opts.filter(o=>o.toLowerCase().includes(q.toLowerCase())) : opts;
    if(!filtered.length){ listWrap.innerHTML=`<div class="ms-empty">Sem opções</div>`; return; }
    listWrap.innerHTML = filtered.map(o=>`
      <label class="ms-option">
        <input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}>
        <span title="${esc(o)}">${esc(o)}</span>
      </label>
    `).join('');
    listWrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change',()=>{
        const cur = S.filters[key]||[];
        if(cb.checked){ if(!cur.includes(cb.value)) S.filters[key]=[...cur,cb.value]; }
        else { S.filters[key]=(cur).filter(x=>x!==cb.value); if(!S.filters[key].length) delete S.filters[key]; }
        updateTriggerLabel(trigger, key);
        applyAndRender();
      });
    });
  }
  renderOpts();
  si.addEventListener('input',()=>renderOpts(si.value));
  dropdown.appendChild(listWrap);
  wrap.appendChild(trigger);
  wrap.appendChild(dropdown);

  function updateTriggerLabel(trig, k){
    const sel=S.filters[k]||[];
    const lbl=trig.querySelector('.ms-label');
    if(sel.length===0){ lbl.textContent='Todos'; trig.classList.remove('has-value','open'); }
    else if(sel.length===1){ lbl.textContent=sel[0]; trig.classList.add('has-value'); }
    else { lbl.textContent=`${sel.length} selecionados`; trig.classList.add('has-value'); }
  }
  updateTriggerLabel(trigger,key);

  trigger.addEventListener('click',(e)=>{
    e.stopPropagation();
    const isOpen = dropdown.classList.contains('open');
    closeAllDropdowns();
    if(!isOpen){
      dropdown.classList.add('open');
      trigger.classList.add('open');
      si.focus();
    }
  });

  return wrap;
}

function buildDateRange(key){
  const wrap = document.createElement('div');
  wrap.className = 'date-range';

  const fromI = document.createElement('input');

  const toI = document.createElement('input');

  }

  function onChange(){

    if(from||to){ S.filters[key]={from,to}; wrap.classList.add('has-value'); }
    else { delete S.filters[key]; wrap.classList.remove('has-value'); }
    applyAndRender();
  }
  fromI.addEventListener('change',onChange);
  toI.addEventListener('change',onChange);

  wrap.appendChild(fromI); wrap.appendChild(sep); wrap.appendChild(toI);

function buildMonthRange(key){
  const wrap = document.createElement('div');
  wrap.className = 'date-range';
  wrap.dataset.drKey = key;

  const fromI = document.createElement('input');
  fromI.type='month'; fromI.dataset.drFrom=key;
  fromI.style.width='130px';
  const sep = document.createElement('span');
  sep.textContent='→';
  const toI = document.createElement('input');
  toI.type='month'; toI.dataset.drTo=key;
  toI.style.width='130px';

  const cur=S.filters[key];
  if(cur&&typeof cur==='object'){
    if(cur.from) fromI.value=cur.from;
    if(cur.to) toI.value=cur.to;
    if(cur.from||cur.to) wrap.classList.add('has-value');
  }

  function onChange(){
    // month input value = "YYYY-MM", convert to date range
    const from=fromI.value, to=toI.value;
    if(from||to){
      // store as-is, interpret in filter logic
      S.filters[key]={from: from ? from+'-01' : '', to: to ? lastDayOfMonth(to) : ''};
      wrap.classList.add('has-value');
    } else {
      delete S.filters[key]; wrap.classList.remove('has-value');
    }
    applyAndRender();
  }
  fromI.addEventListener('change',onChange);
  toI.addEventListener('change',onChange);

  wrap.appendChild(fromI); wrap.appendChild(sep); wrap.appendChild(toI);
  return wrap;
}

function lastDayOfMonth(ym){ // ym = "YYYY-MM"
  const [y,m]=ym.split('-').map(Number);
  return new Date(y,m,0).toISOString().slice(0,10);
}

function syncFilterUI(){
  document.querySelectorAll('.ms-wrap').forEach(wrap=>{
    const k=wrap.dataset.msKey;
    const trigger=wrap.querySelector('.ms-trigger');
    const lbl=trigger.querySelector('.ms-label');
    const sel=S.filters[k]||[];
    if(sel.length===0) lbl.textContent='Todos';
    else if(sel.length===1) lbl.textContent=sel[0];
    else lbl.textContent=`${sel.length} selecionados`;
    trigger.classList.toggle('has-value',sel.length>0);

    const list=wrap.querySelector('[data-list]');
    if(list){
      list.querySelectorAll('input[type=checkbox]').forEach(cb=>{

      });

// ── Apply filters ────────────────────────────────────────────────
function applyFilters(){
  let data = [...S.raw];

  // Global search
  const q = document.getElementById('globalSearch').value.trim().toLowerCase();
  if(q) data = data.filter(r=>r.__srch.includes(q));

  // Year filter (topbar select)
  const ySel = document.getElementById('yearSel');
  const yVal = ySel?.value||'';
  if(yVal) data = data.filter(r=>r.__year===yVal);

  // Column-level filters
  Object.entries(S.colFilters||{}).forEach(([k,v])=>{
    if(!v||!v.length) return;
    const def = colDef(k);
    if(Array.isArray(v)){
      // ms filter
      data = data.filter(r=>{
        const rv = String(r[k]||'').trim();
        return v.includes(rv);
      });
    } else if(v && typeof v==='object' && ('from' in v || 'to' in v)){
      // date/month range
      if(v.from) data=data.filter(r=>{ const d=asDate(r[k]); return d&&d>=new Date(v.from); });
      if(v.to)   data=data.filter(r=>{ const d=asDate(r[k]); return d&&d<=new Date(v.to+'T23:59:59'); });
    }
  });

  // Legacy FILTERS array (empty now, kept for compatibility)
  FILTERS.forEach(f=>{
    const v = S.filters[f.key];
    if(!v) return;
    if(f.type==='ms'){
      const arr=Array.isArray(v)?v:[v];
      if(arr.length) data=data.filter(r=>arr.includes(String(r[f.key]||'').trim()));
    }
  });

  // Sort
  const {key,dir}=S.sort;
  const type=colDef(key)?.type||'text';
  data.sort((a,b)=>{
    let res=0;
    if(type==='number') res=Number(a[key]||0)-Number(b[key]||0);
    else if(type==='date') res=(asDate(a[key])?.getTime()||0)-(asDate(b[key])?.getTime()||0);
    else res=String(a[key]||'').localeCompare(String(b[key]||''),'pt-BR',{numeric:true,sensitivity:'base'});
    return dir==='asc'?res:-res;
  });

  S.filtered=data;
  S.page=1;
}

function applyAndRender(){ applyFilters(); renderAll(); }

// ── Render KPIs ──────────────────────────────────────────────────
function renderKpis(){
  const d=S.filtered, r=S.raw;
  const fat=d.reduce((s,x)=>s+Number(x['FAT']||0),0);
  const cart=d.reduce((s,x)=>s+Number(x['CART']||0),0);
  const aFat=d.reduce((s,x)=>s+Math.max(Number(x['CART']||0)-Number(x['FAT']||0),0),0);
  const clients=new Set(d.map(x=>String(x['NOME FANTASIA']||'').trim()).filter(Boolean)).size;
  const pct=cart>0?Math.round(fat/(fat+aFat)*100):0;

  const kpis=[
    {label:'Registros',value:fmtNum(d.length),sub:`de ${fmtNum(r.length)} total`},
    {label:'Faturado',value:fmtNum(fat),sub:'soma FAT',pct},
    {label:'A Faturar',value:fmtNum(aFat),sub:'CART − FAT'},
    {label:'Clientes',value:fmtNum(clients),sub:'únicos filtrados'},
  ];

  const kpisEl = document.getElementById('kpisRow');
  if(kpisEl) kpisEl.innerHTML = kpis.map(k=>`
    <div class="kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-sub">${k.sub}</div>
      ${k.pct!=null?`<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${k.pct}%"></div></div>`:''}
    </div>
  `).join('');
}

// ── Render chips ─────────────────────────────────────────────────
function renderChips(){
  // chips bar removed from HTML, skip silently
  const bar=document.getElementById('chipsBar');
  if(!bar) return;
  const chips=[];
  const q=document.getElementById('globalSearch').value.trim();
  if(q) chips.push({key:'__global__',label:`Busca: ${q}`});
  const yVal=document.getElementById('yearSel')?.value;
  if(yVal) chips.push({key:'__year__',label:`Ano: ${yVal}`});
  Object.entries(S.colFilters||{}).forEach(([k,v])=>{
    if(!v||!v.length) return;
    const def=colDef(k);
    const lbl=def?.label||k;
    if(Array.isArray(v)&&v.length) chips.push({key:k,label:`${lbl}: ${v.length>2?v.length+' itens':v.join(', ')}`});
    else if(v&&typeof v==='object'){const{from,to}=v;if(from||to) chips.push({key:k,label:`${lbl}: ${from||'...'} → ${to||'...'}`});}
  });
  bar.innerHTML = chips.map(c=>`
    <span class="chip">${esc(c.label)}<button data-chip="${esc(c.key)}" title="Remover">×</button></span>
  `).join('');
}

// ── Render table ─────────────────────────────────────────────────
function renderTable(){
  const tw=document.getElementById('tableWrap');
  if(!S.filtered.length){
    tw.innerHTML='<div class="empty-state"><strong>Nenhum resultado.</strong>Ajuste os filtros ou a busca global.</div>';
    return;
  }
  const vcols=COLS.filter(c=>S.visibleCols.has(c.key));
  const start=(S.page-1)*S.pageSize;
  const rows=S.filtered.slice(start,start+S.pageSize);

  // build active column filter keys set for icon highlight
  const activeCF = new Set(Object.keys(S.colFilters||{}).filter(k=>S.colFilters[k]?.length));

  const thead=`<thead><tr>
    ${vcols.map((c,i)=>`<th class="${S.sort.key===c.key?'sort-active':''}" data-col-idx="${i}" style="${S.colWidths&&S.colWidths[c.key]?'width:'+S.colWidths[c.key]+'px;min-width:'+S.colWidths[c.key]+'px;':''}">
      <div class="th-inner">
        <button class="sort-btn" data-sort="${esc(c.key)}">${esc(c.label)}${S.sort.key===c.key?(S.sort.dir==='asc'?' ↑':' ↓'):''}</button>
        <button class="col-filter-btn ${activeCF.has(c.key)?'active':''}" data-colfilt="${esc(c.key)}" title="Filtrar ${esc(c.label)}">▾</button>
      </div>
      <div class="col-resizer" data-resize-col="${esc(c.key)}"></div>
    </th>`).join('')}
    <th style="width:56px;min-width:56px;"><div class="th-inner">IMG</div></th>
  </tr></thead>`;

  const tbody=`<tbody>${rows.map(row=>`<tr data-row-id="${row.__id}" class="${S.selectedRowId===row.__id?'selected':''}">
    ${vcols.map(c=>renderCell(row,c)).join('')}
    <td style="width:56px;min-width:56px;text-align:center;">${row.__img?`<button class="img-btn" data-pid="${row.__id}">ver</button>`:`<span style="color:var(--muted);font-size:0.65rem;">—</span>`}</td>
  </tr>`).join('')}</tbody>`;

  tw.innerHTML=`<table>${thead}${tbody}</table>`;
}

function renderCell(row,col){
  const v=row[col.key];
  if(col.type==='image') return `<td>${row.__img?'<span class="badge s-blue">✓</span>':'<span class="badge empty">—</span>'}</td>`;
  if(col.type==='number') return `<td class="col-num">${esc(fmtNum(v))}</td>`;
  if(col.type==='date') return `<td class="col-date">${esc(fmtDate(v))}</td>`;
  if(col.type==='status'){
    if(!v||v==='') return `<td><span class="badge empty">—</span></td>`;
    return `<td><span class="badge ${statusClass(v)}">${esc(v)}</span></td>`;
  }
  if(col.key==='NOME FANTASIA') return `<td style="text-align:left"><span class="col-name" title="${esc(v)}">${esc(v||'—')}</span></td>`;
  if(col.key==='REFERENCIA') return `<td class="col-ref">${esc(v||'—')}</td>`;
  return `<td>${esc(v||'—')}</td>`;
}

// ── Load data ─────────────────────────────────────────────────────
async function loadData(){
  const icon=document.getElementById('refreshIcon');
  icon.classList.add('spin');
  document.getElementById('tableWrap').innerHTML='<div class="loading-state"><strong>Carregando planilha...</strong>Processando dados, aguarde.</div>';
  try{
    const res=await fetch(XLSX_PATH,{cache:'no-store'});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    S.raw=parseXlsx(wb);
    buildYearSelect();
    buildFilterBar();
    applyFilters();
    renderAll();
  }catch(err){
    document.getElementById('tableWrap').innerHTML=`<div class="empty-state"><strong>Não foi possível carregar DETALHADA.xlsx</strong>${esc(err.message)}<br><br>Certifique-se que o arquivo está na raiz do repositório publicado.</div>`;
  }finally{
    icon.classList.remove('spin');
  }
}

// ── Debounce ──────────────────────────────────────────────────────
function debounce(fn,ms){ let t; return(...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

  // Column filter button
  const cfBtn=e.target.closest('[data-colfilt]');
  if(cfBtn){ openColFilter(cfBtn); return; }

  // Row selection (click on tr, not on buttons)
  const tr=e.target.closest('tbody tr');
  if(tr && !e.target.closest('button')){
    if(tr.dataset.rowId){
      const id=Number(tr.dataset.rowId);
      if(S.selectedRowId===id){ S.selectedRowId=null; tr.classList.remove('selected'); }
      else {
        document.querySelectorAll('tr.selected').forEach(r=>r.classList.remove('selected'));
        S.selectedRowId=id; tr.classList.add('selected');
      }
    }
    return;
  }
  // Sort
  const sb=e.target.closest('[data-sort]');
  if(sb){
    const k=sb.dataset.sort;
    if(S.sort.key===k) S.sort.dir=S.sort.dir==='asc'?'desc':'asc';
    else S.sort={key:k,dir:'asc'};
    applyFilters(); renderTable(); renderPagination(); return;
  }
  // Image preview
  const pb=e.target.closest('[data-pid]');
  if(pb){
    const row=S.filtered.find(r=>r.__id===Number(pb.dataset.pid));
    if(row) openModal(row); return;
  }
  // Chip remove
  const chip=e.target.closest('[data-chip]');
  if(chip){
    const k=chip.dataset.chip;
    if(k==='__global__'){ gSearch.value=''; }
    else if(k==='__year__'){ const ys=document.getElementById('yearSel'); if(ys) ys.value=''; }
    else { delete S.colFilters[k]; delete S.filters[k]; }
    applyAndRender(); return;
  }
  // Pagination
  if(e.target.id==='pgPrev'&&S.page>1){ S.page--; renderTable(); renderPagination(); }
  if(e.target.id==='pgNext'){
    const total=Math.ceil(S.filtered.length/S.pageSize);
    if(S.page<total){ S.page++; renderTable(); renderPagination(); }
  }
});
document.addEventListener('change',(e)=>{
  if(e.target.id==='pgSize'){ S.pageSize=Number(e.target.value); S.page=1; renderTable(); renderPagination(); }
});

(function setupColResize(){

  document.addEventListener('mousedown',(e)=>{
    const handle=e.target.closest('.col-resizer');
    if(!handle) return;

    const th=handle.closest('th');
    const colKey=handle.dataset.resizeCol;
    const startX=e.clientX;
    const startW=th.offsetWidth;
    handle.classList.add('resizing');
    resizing={th,colKey,startX,startW};
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
  });
  document.addEventListener('mousemove',(e)=>{
    if(!resizing) return;
    const delta=e.clientX-resizing.startX;
    const newW=Math.max(40, resizing.startW+delta);
    resizing.th.style.width=newW+'px';
    resizing.th.style.minWidth=newW+'px';
    S.colWidths[resizing.colKey]=newW;
  });
  document.addEventListener('mouseup',()=>{
    if(!resizing) return;
    resizing.th.querySelector('.col-resizer')?.classList.remove('resizing');
    resizing=null;
    document.body.style.cursor='';
    document.body.style.userSelect='';
  });
})();

// ESC clears search
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if(gSearch && gSearch.value){ gSearch.value=''; applyAndRender(); }
    closeColFilter();
  }
});

// ── Copy on text selection ────────────────────────────────────────
let _toastTimer=null;
function showToast(val){
  const t=document.getElementById('toast');
  const tv=document.getElementById('toastVal');
  if(!t||!tv) return;
  tv.textContent=val;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('mouseup',(e)=>{
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed) return;
  const txt=sel.toString().trim();
  if(!txt) return;
  // Only copy if selection is inside the table
  const anchor=sel.anchorNode?.parentElement;
  if(!anchor?.closest('#tableWrap')) return;
  navigator.clipboard.writeText(txt).then(()=>showToast(txt)).catch(()=>{});
});
let _cfpKey = null;
const cfpEl = document.getElementById('colFilterPanel');

function openColFilter(btn){
  const key = btn.dataset.colfilt;
  _cfpKey = key;
  const def = colDef(key);
  document.getElementById('cfpTitle').textContent = `Filtrar: ${def?.label||key}`;

  // Position panel below the button
  const rect = btn.getBoundingClientRect();
  cfpEl.style.top = (rect.bottom + 4 + window.scrollY) + 'px';
  cfpEl.style.left = Math.min(rect.left, window.innerWidth - 290) + 'px';

  // Build body
  const body = document.getElementById('cfpBody');
  body.innerHTML='';

  if(def?.type==='date'){
    // Month range
    const cur = S.colFilters[key]||{};
    // extract YYYY-MM from stored YYYY-MM-DD
    const fromM = cur.from ? cur.from.slice(0,7) : '';
    const toM   = cur.to   ? cur.to.slice(0,7)   : '';
    const div = document.createElement('div');
    div.className='cfp-month';
    div.innerHTML=`
      <label>De</label><input type="month" id="cfpFrom" value="${fromM}">
      <label>Até</label><input type="month" id="cfpTo" value="${toM}">
    `;
    body.appendChild(div);
  } else {
    // Multi-select list
    const allVals = [...new Set(S.raw.map(r=>String(r[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const sel = S.colFilters[key]||[];

    const srchDiv = document.createElement('div');
    srchDiv.className='cfp-search';
    srchDiv.innerHTML=`<input type="text" id="cfpSrch" placeholder="Buscar...">`;
    body.appendChild(srchDiv);

    const listDiv = document.createElement('div');
    listDiv.className='cfp-list';
    listDiv.id='cfpList';
    body.appendChild(listDiv);

    function renderOpts(q=''){
      const filtered = q ? allVals.filter(v=>v.toLowerCase().includes(q.toLowerCase())) : allVals;
      if(!filtered.length){ listDiv.innerHTML=`<div class="cfp-empty">Sem opções</div>`; return; }
      listDiv.innerHTML = filtered.map(v=>`
        <label class="cfp-option">
          <input type="checkbox" value="${esc(v)}" ${sel.includes(v)?'checked':''}>
          <span title="${esc(v)}">${esc(v)}</span>
        </label>
      `).join('');
    }
    renderOpts();
    document.getElementById('cfpSrch').addEventListener('input',e=>renderOpts(e.target.value));
  }

  cfpEl.classList.add('open');
  e?.stopPropagation?.();
}

function closeColFilter(){ cfpEl.classList.remove('open'); _cfpKey=null; }

document.getElementById('cfpClose').addEventListener('click', closeColFilter);
document.addEventListener('click',(e)=>{
  if(!cfpEl.contains(e.target) && !e.target.closest('[data-colfilt]')) closeColFilter();
});

document.getElementById('cfpClear').addEventListener('click',()=>{
  if(!_cfpKey) return;
  delete S.colFilters[_cfpKey];
  closeColFilter();
  applyAndRender();
});

document.getElementById('cfpApply').addEventListener('click',()=>{
  if(!_cfpKey) return;
  const def = colDef(_cfpKey);
  if(def?.type==='date'){
    const from = document.getElementById('cfpFrom')?.value;
    const to   = document.getElementById('cfpTo')?.value;
    if(from||to){
      S.colFilters[_cfpKey] = {
        from: from ? from+'-01' : '',
        to:   to   ? lastDayOfMonth(to) : ''
      };
    } else { delete S.colFilters[_cfpKey]; }
  } else {
    const checked = [...document.querySelectorAll('#cfpList input[type=checkbox]:checked')].map(cb=>cb.value);
    if(checked.length) S.colFilters[_cfpKey]=checked;
    else delete S.colFilters[_cfpKey];
  }
  closeColFilter();
  applyAndRender();
});

// ── Init ──────────────────────────────────────────────────────────
loadPrefs();
initCols();
buildColumnsPanel();
applyUiPrefs();
loadData();
</script>
